<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Factory Control Room</title>
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/widgets.css">
  <link rel="stylesheet" href="styles/twin.css">
</head>
<body>
  <!-- The entire UI is rendered by the platform from configuration. -->
  <div id="app"></div>

  <!-- ═══ Vendor ═════════════════════════════════════════════════════════ -->
  <script src="vendor/chart.umd.min.js"></script>

  <!-- ═══ Platform core (order matters: namespace first) ════════════════ -->
  <script src="src/core/namespace.js"></script>
  <script src="src/core/config-registry.js"></script>
  <script src="src/core/event-bus.js"></script>
  <script src="src/core/format.js"></script>
  <script src="src/core/dom.js"></script>
  <script src="src/core/expressions.js"></script>
  <script src="src/core/icons.js"></script>

  <!-- ═══ Data layer ═════════════════════════════════════════════════════ -->
  <script src="src/data/history-buffer.js"></script>
  <script src="src/data/data-hub.js"></script>
  <script src="src/data/sources/simulation-source.js"></script>
  <script src="src/data/sources/omi-source.js"></script>
  <script src="src/data/sources/rest-source.js"></script>
  <script src="src/data/sources/derived-source.js"></script>
  <script src="src/data/sources/computed-source.js"></script>
  <script src="src/data/machine-registry.js"></script>

  <!-- ═══ State + alarm engines ══════════════════════════════════════════ -->
  <script src="src/state/state-engine.js"></script>
  <script src="src/state/alarm-engine.js"></script>

  <!-- ═══ UI framework ═══════════════════════════════════════════════════ -->
  <script src="src/ui/theme-engine.js"></script>
  <script src="src/ui/widget-registry.js"></script>
  <script src="src/ui/dashboard-renderer.js"></script>
  <script src="src/ui/navigation.js"></script>
  <script src="src/ui/app-shell.js"></script>

  <!-- ═══ Digital twin engine (Factory Map page — see docs/factory-map.md) ═ -->
  <script src="src/twin/twin-store.js"></script>
  <script src="src/twin/twin-model.js"></script>
  <script src="src/twin/twin-camera.js"></script>
  <script src="src/twin/twin-data.js"></script>
  <script src="src/twin/twin-router.js"></script>
  <script src="src/twin/twin-renderer.js"></script>
  <script src="src/twin/twin-render-connections.js"></script>
  <script src="src/twin/twin-minimap.js"></script>
  <script src="src/twin/twin-interactions.js"></script>
  <script src="src/twin/twin-toolbar.js"></script>
  <script src="src/twin/twin-panels.js"></script>

  <!-- ═══ Widget library (add new widget types here) ═════════════════════ -->
  <script src="src/widgets/kpi-card.js"></script>
  <script src="src/widgets/time-series.js"></script>
  <script src="src/widgets/donut-chart.js"></script>
  <script src="src/widgets/bar-chart.js"></script>
  <script src="src/widgets/stat-list.js"></script>
  <script src="src/widgets/progress-list.js"></script>
  <script src="src/widgets/alarm-list.js"></script>
  <script src="src/widgets/data-table.js"></script>
  <script src="src/widgets/machine-grid.js"></script>
  <script src="src/widgets/factory-twin.js"></script>
  <script src="src/widgets/energy-flow.js"></script>

  <!-- ═══ Configuration (data only — this is what site engineers edit) ═══ -->
  <script src="config/theme.dark.config.js"></script>
  <script src="config/theme.light.config.js"></script>
  <script src="config/states.config.js"></script>
  <script src="config/tags.config.js"></script>
  <script src="config/machines.config.js"></script>
  <script src="config/twin/twin.config.js"></script>
  <script src="config/twin/twin.layout.config.js"></script>
  <script src="config/twin/twin.connections.config.js"></script>
  <script src="config/alarm-rules.config.js"></script>
  <script src="config/dashboards/overview.dashboard.js"></script>
  <script src="config/dashboards/energy.dashboard.js"></script>
  <script src="config/dashboards/machines.dashboard.js"></script>
  <script src="config/dashboards/factory-map.dashboard.js"></script>
  <script src="config/dashboards/maintenance.dashboard.js"></script>
  <script src="config/dashboards/analytics.dashboard.js"></script>
  <script src="config/app.config.js"></script>

  <!-- ═══ Bootstrap (must be last) ═══════════════════════════════════════ -->
  <script src="src/app.js"></script>
</body>
</html>
